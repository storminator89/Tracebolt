[package]
name = "tracebolt-windows-agent"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
fs2 = "0.4"
hmac = "0.12"
hyper-util = { version = "0.1", default-features = false, features = ["client-legacy"] }
rcgen = "0.14"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
ring = "0.17"
rpassword = "7"
rustls = { version = "0.23", default-features = false, features = ["std"] }
rusqlite = { version = "0.38", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tower-service = "0.3"
uuid = { version = "1", features = ["v4"] }
x509-parser = { version = "0.18", features = ["verify"] }

[target.'cfg(windows)'.dependencies]
windows-service = "0.8"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_Storage_FileSystem", "Win32_System_EventLog", "Win32_Security"] }

[dev-dependencies]
rcgen = "0.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
