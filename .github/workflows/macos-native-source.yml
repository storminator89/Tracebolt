name: macOS native-harness inert source checks

on:
  pull_request:
    paths:
      - '.github/workflows/macos-native-source.yml'
      - 'tests/macosnativeacceptance/**'
      - 'docs/macos-native-acceptance.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/macos-native-source.yml'
      - 'tests/macosnativeacceptance/**'
      - 'docs/macos-native-acceptance.md'

permissions:
  contents: read

concurrency:
  group: macos-native-source-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inert-python:
    name: Inert Python contracts on Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Hash public source without native execution
        run: python3 -I -B tests/macosnativeacceptance/run.py --check
      - name: Run parser and fake-process tests only
        run: python3 -B -m unittest discover -s tests/macosnativeacceptance -p 'test_*.py'
