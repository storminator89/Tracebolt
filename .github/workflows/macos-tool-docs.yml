name: macOS built-in documentation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/macos-tool-docs.yml'
      - 'tests/macostooldocs/**'
      - 'docs/macos-tool-docs.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/macos-tool-docs.yml'
      - 'tests/macostooldocs/**'
      - 'docs/macos-tool-docs.md'

permissions:
  contents: read

concurrency:
  group: macos-tool-docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  documentation:
    name: Built-in help only on ${{ matrix.runner }}
    # Standard hosted public-repository runners only; no paid/private fallback.
    if: ${{ github.event.repository.private == false }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      TRACEBOLT_RUNNER_LABEL: ${{ matrix.runner }}
      TRACEBOLT_REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate fixed help commands without native invocation
        run: python3 -B tests/macostooldocs/run.py --check
      - name: Test dispatcher and bounds with inert substitutes
        run: python3 -B -m unittest discover -s tests/macostooldocs -p 'test_*.py' -v
      - name: Capture only help, public manuals and versions
        env:
          TRACEBOLT_RUNNER_OS: ${{ runner.os }}
          TRACEBOLT_RUNNER_ARCH: ${{ runner.arch }}
        run: python3 -B tests/macostooldocs/run.py
      - name: Keep only bounded documentation evidence
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-tool-docs-${{ matrix.runner }}-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 14
          path: artifacts/review/macos-tool-docs.json
