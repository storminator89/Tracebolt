name: macOS endpoint source-only checks

on:
  pull_request:
    paths:
      - 'tests/macosendpointfixture/**'
      - '.github/workflows/macos-endpoint-acceptance.yml'
      - '.github/workflows/macos-endpoint-source.yml'
      - 'go.mod'
      - 'go.sum'
  push:
    branches: [main]
    paths:
      - 'tests/macosendpointfixture/**'
      - '.github/workflows/macos-endpoint-acceptance.yml'
      - '.github/workflows/macos-endpoint-source.yml'
      - 'go.mod'
      - 'go.sum'

permissions:
  contents: read

concurrency:
  group: macos-endpoint-source-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inert-contracts-and-crossbuilds:
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GOTOOLCHAIN: local
      GOENV: 'off'
      GOWORK: 'off'
      GOFLAGS: '-mod=readonly'
      CGO_ENABLED: '0'
      GOMAXPROCS: '2'
      GO_DOWNLOAD_BASE_URL: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          token: ''
          cache: false
          check-latest: false
      - name: Verify locked Go dependencies
        run: go mod download && go mod verify
      - name: Run pure contracts and fake adapters only
        env:
          GOPROXY: 'off'
          GOSUMDB: 'off'
        run: |
          go test -p 1 -buildvcs=false ./tests/macosendpointfixture
          python3 -I -S -B -m unittest discover -s tests/macosendpointfixture -p 'test_*.py'
          python3 -I -S -B tests/macosendpointfixture/gate.py --check
      - name: Cross-compile exact manual build flags without executing targets
        env:
          GOPROXY: 'off'
          GOSUMDB: 'off'
          GOOS: darwin
        run: |
          for arch in arm64 amd64; do
            export GOARCH="$arch"
            go test -c -p 1 -trimpath -buildvcs=false -o "$RUNNER_TEMP/endpoint-$arch.test" ./tests/macosendpointfixture
            go build -p 1 -trimpath -buildvcs=false -tags=tracebolt_endpoint_native -o "$RUNNER_TEMP/endpoint-peer-$arch" ./tests/macosendpointfixture
            go build -p 1 -trimpath -buildvcs=false -o "$RUNNER_TEMP/enroll-agent-$arch" ./cmd/enroll-agent
            go build -p 1 -trimpath -buildvcs=false -o "$RUNNER_TEMP/macos-agent-$arch" ./cmd/macos-agent
          done
      # The Darwin files are compilation outputs only. No target runs or uploads.
