      - name: Synthetic service-action-v2 impact review and EN-DE desktop-mobile screenshots
        if: ${{ !cancelled() }}
        env:
          TRACEBOLT_SOURCE_SHA: ${{ github.sha }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
