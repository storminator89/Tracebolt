          python3 tests/security/check_complete_overview_browser_gate.py artifacts/review/complete-overview-browser-results.json
      - name: Synthetic service-action preview, approval and status browser acceptance
        if: ${{ !cancelled() }}
        env:
          TRACEBOLT_SOURCE_SHA: ${{ github.sha }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          python3 tests/security/test_service_action_browser_gate.py
          python3 -O tests/security/test_service_action_browser_gate.py
          node tests/e2e-review/service-action-browser.mjs
          python3 tests/security/check_service_action_browser_gate.py artifacts/review/service-action-browser-results.json
      - name: Synthetic service-action-v2 impact review and EN-DE desktop-mobile screenshots
        if: ${{ !cancelled() }}
        env:
          TRACEBOLT_SOURCE_SHA: ${{ github.sha }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          python3 tests/security/test_service_action_v2_browser_gate.py
          python3 -O tests/security/test_service_action_v2_browser_gate.py
          node tests/e2e-review/service-action-v2-browser.mjs
          python3 tests/security/check_service_action_v2_browser_gate.py artifacts/review/service-action-v2-browser-results.json
      - name: Real React and v3 handler read-coordination regression
        if: ${{ !cancelled() }}
        run: ./web/node_modules/.bin/vitest run --config tests/e2e-review/v3-dom.config.mts
      - name: Keep browser review evidence briefly
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ui-review-${{ github.sha }}
          path: |
