              if len(windows) != 1 or windows[0].get('details') != {'screens': 4, 'transport': 'intercepted production-handler vectors', 'liveStoreAcceptance': False, 'nativeAcceptance': False}:
                  raise ValueError('wrong Windows boundary')
              manifest = json.loads(Path('artifacts/review/fleet-identity-browser-manifest.json').read_bytes())
              if manifest.get('sourceSha') != os.environ['TRACEBOLT_SOURCE_SHA']:
                  raise ValueError('wrong screenshot source')
              screens = [item for item in manifest.get('screenshots', []) if item.get('test') == windows[0]['name']]
              expected = {f'synthetic-windows-fleet-{width}-{locale}.png' for width in (1440, 390) for locale in ('en', 'de')}
              if len(screens) != 4 or {item.get('file') for item in screens} != expected:
                  raise ValueError('missing Windows screenshots')
              import hashlib
              for item in screens:
                  if item.get('sourceSha') != os.environ['TRACEBOLT_SOURCE_SHA'] or item.get('publicSafe') is not True or item.get('fullPage') is not False or 'not live Windows manager/store acceptance' not in item.get('fixtureDisclosure', ''):
                      raise ValueError('invalid Windows screenshot scope')
                  if item['file'] != f"synthetic-windows-fleet-{item.get('viewport', {}).get('width')}-{item.get('locale')}.png" or hashlib.sha256(Path('artifacts/review', item['file']).read_bytes()).hexdigest() != item.get('sha256'):
                      raise ValueError('invalid Windows screenshot identity')
          except Exception:
              raise SystemExit('FAIL: incomplete, mismatched or unsafe fleet browser evidence.')
          print('PASS: five Linux store cases and one Windows vector UI case with four exact-source screenshots; invented metadata only.')
          PYTHON
      - name: Journal request, snapshot and lifecycle browser acceptance
        if: ${{ !cancelled() }}
        env:
          TRACEBOLT_SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 tests/security/test_journal_browser_gate.py
          python3 -O tests/security/test_journal_browser_gate.py
