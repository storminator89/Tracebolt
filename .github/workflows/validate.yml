name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debian-security-feed:
    name: Official Debian security feed compatibility
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Validate the fixed public feed without endpoint inventory
        env:
          TRACEBOLT_CVE_FEED_SMOKE: '1'
          GOTOOLCHAIN: local
        run: go test ./internal/linuxcvefeed -run '^TestOfficialDebianFeedSmoke$' -count=1 -timeout=3m -v

  native-agent:
    name: Native agent runtime (${{ matrix.platform }}/${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux
            arch: amd64
          - runner: ubuntu-24.04-arm
            platform: linux
            arch: arm64
          - runner: windows-2025
            platform: windows
            arch: amd64
          - runner: macos-15
            platform: macos
            arch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install pinned schema validator
        run: python -m pip install -r tests/security/requirements.txt
      - name: Execute native package tests and actual read-only agent CLI
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python tests/security/run_native_smoke.py --expect-platform ${{ matrix.platform }} --expect-arch ${{ matrix.arch }}
      - name: Execute ARM64 Linux installer and helper fixture tests natively
        if: matrix.platform == 'linux' && matrix.arch == 'arm64'
        env:
          GOTOOLCHAIN: local
        run: |
          go test -race -buildvcs=false ./internal/agentinstall ./internal/socketowner ./internal/systeminventory ./internal/operational ./internal/completeoverview ./internal/linuxpackages ./internal/cachedupdates ./internal/assessment ./cmd/agent-service
          CGO_ENABLED=0 go build -buildvcs=false ./cmd/lan-manager ./cmd/action-setup ./cmd/lan-agent ./cmd/enroll-agent ./cmd/agent-service ./cmd/socket-owner-reader

  package-dense-race:
    name: Dense package race (${{ matrix.topology }}/${{ matrix.profile }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        topology: [same-handle, cross-handle]
        profile: [tls, http-test]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Prepare verified dependencies before the offline dense test
        run: |
          go mod download
          go mod verify
      - name: Run one exact dense case with the unchanged ten-minute test budget
        env:
          DENSE_TOPOLOGY: ${{ matrix.topology }}
          DENSE_PROFILE: ${{ matrix.profile }}
          GOTOOLCHAIN: local
          GOPROXY: off
          GOSUMDB: off
        shell: bash
        run: |
          set -euo pipefail
          ROOT_TEST=TestIndependentPackageStoreDenseCapacityAndActualIngress
          (umask 077; : > "$RUNNER_TEMP/dense-package-race.jsonl"; : > "$RUNNER_TEMP/dense-package-race.stderr")
          if ! go test -race -json -buildvcs=false ./tests/security \
            -run "^${ROOT_TEST}$/^${DENSE_TOPOLOGY}$/^${DENSE_PROFILE}$" \
            -count=1 -timeout=10m > "$RUNNER_TEMP/dense-package-race.jsonl" 2> "$RUNNER_TEMP/dense-package-race.stderr"; then
            echo 'FAIL: exact dense package race case; raw runtime output withheld.'
            exit 1
          fi
          python3 - "$RUNNER_TEMP/dense-package-race.jsonl" <<'PYTHON'
          import json, os, sys
          root = 'TestIndependentPackageStoreDenseCapacityAndActualIngress'
          expected = root + '/' + os.environ['DENSE_TOPOLOGY'] + '/' + os.environ['DENSE_PROFILE']
          required = {root, expected}
          passed = set()
          package_passed = False
          try:
              with open(sys.argv[1], encoding='utf-8') as stream:
                  for line in stream:
                      event = json.loads(line)
                      if event.get('Action') == 'fail':
                          raise ValueError('failed event')
                      if event.get('Test') in required:
                          if event.get('Package') != 'localrmm/tests/security':
                              raise ValueError('wrong package')
                          if event.get('Action') == 'skip':
                              raise ValueError('skipped case')
                          if event.get('Action') == 'pass':
                              passed.add(event['Test'])
                      if event.get('Package') == 'localrmm/tests/security' and 'Test' not in event and event.get('Action') == 'pass':
                          package_passed = True
              if passed != required or not package_passed:
                  raise ValueError('incomplete result')
          except Exception:
              raise SystemExit('FAIL: missing, skipped or invalid dense-case completion evidence.')
          print('PASS: ' + expected)
          PYTHON

  ubuntu-package-native:
    name: Positive native Ubuntu package and operational observations
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Prepare pinned native test dependencies without host changes
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          command -v python3 > /dev/null
          go mod download
          go mod verify
      - name: Require four actual positive native observations across TLS and HTTP-test
        env:
          TRACEBOLT_PACKAGE_UBUNTU2404_TEST: '1'
          GOTOOLCHAIN: local
          GOPROXY: 'off'
          GOSUMDB: 'off'
        shell: bash
        run: |
          set -euo pipefail
          (umask 077; : > "$RUNNER_TEMP/positive-native-package.jsonl")
          if ! go test -json -buildvcs=false ./cmd/lan-manager \
            -run '^TestPackageUbuntu2404PositiveNative$' -count=1 -timeout=8m \
            > "$RUNNER_TEMP/positive-native-package.jsonl" 2>&1; then
            echo 'FAIL: positive Ubuntu native observations; raw source and runtime output withheld.'
            exit 1
          fi
          python3 - "$RUNNER_TEMP/positive-native-package.jsonl" <<'PYTHON'
          import json, sys
          root = 'TestPackageUbuntu2404PositiveNative'
          required = {root, root + '/tls', root + '/http-test'}
          passed = set()
          package_passed = False
          try:
              with open(sys.argv[1], encoding='utf-8') as stream:
                  for line in stream:
                      event = json.loads(line)
                      if event.get('Action') == 'fail':
                          raise ValueError('failed event')
                      if event.get('Test') in required:
                          if event.get('Package') != 'localrmm/cmd/lan-manager':
                              raise ValueError('wrong package')
                          if event.get('Action') == 'skip':
                              raise ValueError('skipped case')
                          if event.get('Action') == 'pass':
                              passed.add(event['Test'])
                      if event.get('Package') == 'localrmm/cmd/lan-manager' and 'Test' not in event and event.get('Action') == 'pass':
                          package_passed = True
              if passed != required or not package_passed:
                  raise ValueError('incomplete result')
          except Exception:
              raise SystemExit('FAIL: missing, skipped or invalid positive-native completion evidence.')
          print('PASS: four actual positive Ubuntu package/operational samples across native TLS and HTTP-test flows; no raw observation data exported.')
          PYTHON

  complete-v3-native:
    name: Positive v3 Ubuntu inventory, endpoint consent and native restart
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Prepare pinned dependencies as the ordinary runner account
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          command -v python3 > /dev/null
          go mod download
          go mod verify
      - name: Verify bounded diagnostic projection with inert records
        run: |
          python3 tests/security/test_complete_mvp_reporter.py
          python3 tests/security/test_endpoint_identity_gate.py
          python3 -O tests/security/test_endpoint_identity_gate.py
          python3 tests/security/test_complete_overview_native_gate.py
          python3 -O tests/security/test_complete_overview_native_gate.py
      - name: Require positive v3 data through approval and process restart
        env:
          TRACEBOLT_COMPLETE_RUNTIME_TEST: '1'
          TRACEBOLT_COMPLETE_UBUNTU2404_TEST: '1'
          TRACEBOLT_ENDPOINT_IDENTITY_RUNTIME_TEST: '1'
          TRACEBOLT_COMPLETE_OVERVIEW_RUNTIME_TEST: '1'
          GOTOOLCHAIN: local
          GOPROXY: 'off'
          GOSUMDB: 'off'
        shell: bash
        run: |
          set -euo pipefail
          (umask 077; : > "$RUNNER_TEMP/complete-v3-native.jsonl"; : > "$RUNNER_TEMP/complete-v3-native.stderr")
          TRACEBOLT_RUN_UID=$(id -ru)
          TRACEBOLT_RUN_GID=$(id -rg)
          test "$TRACEBOLT_RUN_UID" -ne 0
          test "$TRACEBOLT_RUN_GID" -ne 0
          test "$(id -u)" = "$TRACEBOLT_RUN_UID"
          test "$(id -g)" = "$TRACEBOLT_RUN_GID"
          test -x /usr/bin/sudo && test -x /usr/bin/setpriv && test -x /usr/bin/env
          TRACEBOLT_GO_BINARY=$(command -v go)
          TRACEBOLT_GO_CACHE=$(go env GOCACHE)
          TRACEBOLT_GO_MODULES=$(go env GOMODCACHE)
          TRACEBOLT_GO_PATH=$(go env GOPATH)
          # Only setpriv starts privileged. It drops to this same runner identity
          # before env/Go or any repository code; no host account/settings change.
          if ! /usr/bin/sudo -n /usr/bin/setpriv \
            --reuid "$TRACEBOLT_RUN_UID" --regid "$TRACEBOLT_RUN_GID" --clear-groups \
            --inh-caps=-all --ambient-caps=-all --bounding-set=-all --no-new-privs \
            -- /usr/bin/env -i PATH="$PATH" \
            GOCACHE="$TRACEBOLT_GO_CACHE" GOMODCACHE="$TRACEBOLT_GO_MODULES" GOPATH="$TRACEBOLT_GO_PATH" \
            GOTOOLCHAIN=local GOPROXY=off GOSUMDB=off \
            TRACEBOLT_COMPLETE_RUNTIME_TEST=1 TRACEBOLT_COMPLETE_UBUNTU2404_TEST=1 \
            TRACEBOLT_ENDPOINT_IDENTITY_RUNTIME_TEST=1 \
            TRACEBOLT_COMPLETE_OVERVIEW_RUNTIME_TEST=1 \
            "$TRACEBOLT_GO_BINARY" test -json -buildvcs=false ./cmd/lan-manager \
            -run '^TestCompleteMVPPendingApprovalNativeRestart$' -count=1 -timeout=8m \
            > "$RUNNER_TEMP/complete-v3-native.jsonl" 2> "$RUNNER_TEMP/complete-v3-native.stderr"; then
            echo 'FAIL: positive v3 native gate; raw source and runtime output withheld.'
            python3 tests/security/report_complete_mvp.py "$RUNNER_TEMP/complete-v3-native.jsonl" || true
            exit 1
          fi
          python3 tests/security/check_endpoint_identity_gate.py --require-complete-overview "$RUNNER_TEMP/complete-v3-native.jsonl"

  backend:
    name: Go tests and build-only platform checks
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Check release cleanup and journal setup with inert fixtures
        run: |
          python3 -B -m unittest discover -s tests/release -p 'test_*.py' -v
          python3 -B -m unittest discover -s deploy/journal -p 'test_*.py' -v
          python3 -B -m unittest discover -s deploy/inventory -p 'test_*.py' -v
          python3 -B -m unittest discover -s deploy/onboarding -p 'test_*.py' -v
          python3 -O -B -m unittest discover -s deploy/onboarding -p 'test_*.py' -v
          python3 -B tests/security/test_read_admin_scripts.py
          python3 -O -B tests/security/test_read_admin_scripts.py
          python3 -B tests/security/test_read_admin_systemd_gate.py
          python3 -O -B tests/security/test_read_admin_systemd_gate.py
          python3 -B -m unittest discover -s deploy/actions -p 'test_*.py' -v
          python3 -O -B -m unittest discover -s deploy/actions -p 'test_*.py' -v
          python3 -B -m unittest discover -s deploy/update -p 'test_*.py' -v
      - name: Vet
        run: go vet -p 1 ./...
      - name: Validate bounded Go failure projection with inert fixtures
        run: |
          python3 -B tests/security/test_go_failure_reporter.py
          python3 -B tests/security/test_go_aggregate_coverage.py
          python3 -O -B tests/security/test_go_aggregate_coverage.py
          python3 -B tests/security/test_go_timing_reporter.py
          python3 -O -B tests/security/test_go_timing_reporter.py
          python3 -B tests/security/test_action_setup_identity_gate.py
          python3 -O -B tests/security/test_action_setup_identity_gate.py
      - name: Require read-only action setup under the existing runner service identity
        shell: bash
        run: |
          set -euo pipefail
          go mod download
          go mod verify
          (umask 077; : > "$RUNNER_TEMP/action-setup-identity.jsonl"; : > "$RUNNER_TEMP/action-setup-identity.stderr")
          TRACEBOLT_RUN_UID=$(id -ru)
          TRACEBOLT_RUN_GID=$(id -rg)
          test "$TRACEBOLT_RUN_UID" -ne 0
          test "$TRACEBOLT_RUN_GID" -ne 0
          test "$(id -u)" = "$TRACEBOLT_RUN_UID"
          test "$(id -g)" = "$TRACEBOLT_RUN_GID"
          test -x /usr/bin/sudo && test -x /usr/bin/setpriv && test -x /usr/bin/env
          TRACEBOLT_GO_BINARY=$(command -v go)
          TRACEBOLT_GO_CACHE=$(go env GOCACHE)
          TRACEBOLT_GO_MODULES=$(go env GOMODCACHE)
          TRACEBOLT_GO_PATH=$(go env GOPATH)
          # Same privilege-drop boundary as complete-v3-native: only setpriv
          # starts privileged; Go and repository code use the same nonroot
          # runner UID/GID without supplementary groups or capabilities.
          if ! /usr/bin/sudo -n /usr/bin/setpriv \
            --reuid "$TRACEBOLT_RUN_UID" --regid "$TRACEBOLT_RUN_GID" --clear-groups \
            --inh-caps=-all --ambient-caps=-all --bounding-set=-all --no-new-privs \
            -- /usr/bin/env -i PATH="$PATH" \
            GOCACHE="$TRACEBOLT_GO_CACHE" GOMODCACHE="$TRACEBOLT_GO_MODULES" GOPATH="$TRACEBOLT_GO_PATH" \
            GOTOOLCHAIN=local GOPROXY=off GOSUMDB=off \
            "$TRACEBOLT_GO_BINARY" test -race -json -buildvcs=false ./internal/lanclient \
            -run '^TestActionSetupIdentity(LocalCompleteAndNoWrites|RejectsMissingActivationOrLedgers|WorksWhileSenderOwnsAllLedgers)$' \
            -count=1 -timeout=3m \
            > "$RUNNER_TEMP/action-setup-identity.jsonl" 2> "$RUNNER_TEMP/action-setup-identity.stderr"; then
            echo 'FAIL: action-setup service-identity tests; raw fixture output withheld.'
            exit 1
          fi
          python3 -B tests/security/check_action_setup_identity_gate.py "$RUNNER_TEMP/action-setup-identity.jsonl"
      - name: Unit and race tests
        shell: bash
        run: |
          set -euo pipefail
          (umask 077; : > "$RUNNER_TEMP/go-tests.jsonl"; : > "$RUNNER_TEMP/go-tests.stderr")
          tracebolt_test_start=$SECONDS
          if go test -race -json -p 1 -buildvcs=false ./... -skip '^(TestIndependentPackageStoreDenseCapacityAndActualIngress|TestGuidedThreeBinaryEnrollmentAndForeground)$' -count=1 -timeout=15m > "$RUNNER_TEMP/go-tests.jsonl" 2> "$RUNNER_TEMP/go-tests.stderr"; then
            echo 'PASS: Go unit and race tests.'
            tracebolt_test_elapsed=$((SECONDS - tracebolt_test_start))
            python3 -I -B tests/security/report_go_failure.py --success --events "$RUNNER_TEMP/go-tests.jsonl" --stderr "$RUNNER_TEMP/go-tests.stderr" --exit-code 0 --elapsed-seconds "$tracebolt_test_elapsed" || true
          else
            tracebolt_test_status=$?
            tracebolt_test_elapsed=$((SECONDS - tracebolt_test_start))
            echo 'FAIL: Go race tests; raw runtime output withheld.'
            python3 -I -B tests/security/report_go_failure.py --events "$RUNNER_TEMP/go-tests.jsonl" --stderr "$RUNNER_TEMP/go-tests.stderr" --exit-code "$tracebolt_test_status" --elapsed-seconds "$tracebolt_test_elapsed" || true
            exit 1
          fi

      - name: Build local binaries
        run: make build
      - name: Execute actual Linux LAN manager and sender binaries
        run: |
          (umask 077; : > "$RUNNER_TEMP/lan-client-tests.log")
          if ! go test -count=1 -timeout=4m ./tests/lanclient > "$RUNNER_TEMP/lan-client-tests.log" 2>&1; then
            echo 'FAIL: native two-binary TLS/HTTP sender acceptance; raw runtime output withheld.'
            exit 1
          fi
          echo 'PASS: actual Linux manager/sender TLS and HTTP-test round trips, restart, replay and revocation.'
      - name: Actual guided enrollment and foreground reporting across three Linux binaries
        run: |
          command -v python3 > /dev/null
          (umask 077; : > "$RUNNER_TEMP/guided-enrollment-tests.log")
          if ! go test -json -race ./cmd/lan-manager -run '^TestGuidedThreeBinaryEnrollmentAndForeground$' -count=1 -timeout=8m > "$RUNNER_TEMP/guided-enrollment-tests.log" 2>&1; then
            echo 'FAIL: guided three-binary enrollment/foreground; raw invitation and runtime output withheld.'
            exit 1
          fi
          python3 - "$RUNNER_TEMP/guided-enrollment-tests.log" <<'PYTHON'
          import json, sys
          expected = {"TestGuidedThreeBinaryEnrollmentAndForeground", "TestGuidedThreeBinaryEnrollmentAndForeground/tls", "TestGuidedThreeBinaryEnrollmentAndForeground/http-test"}
          passed = set()
          with open(sys.argv[1], encoding="utf-8") as stream:
              for line in stream:
                  event = json.loads(line)
                  if event.get("Action") == "pass" and event.get("Test") in expected:
                      passed.add(event["Test"])
          if passed != expected:
              print("FAIL: actual guided TLS/HTTP test execution not fully confirmed; skips do not pass this gate.")
              raise SystemExit(1)
          print("PASS: actual manager, hidden-terminal enrollment client and foreground sender under TLS and explicit HTTP test.")
          PYTHON
      - name: Execute Linux agent and validate bounded support-bundle schema
        run: |
          python3 -m venv "$RUNNER_TEMP/bundle-validator"
          "$RUNNER_TEMP/bundle-validator/bin/python" -m pip install -r tests/security/requirements.txt
          set -o pipefail
          ./bin/agent --support-bundle | "$RUNNER_TEMP/bundle-validator/bin/python" tests/security/validate_bundle.py --expect-platform linux -
      - name: Cross-build native previews (not target-OS runtime validation)
        run: make crosscheck
      - name: Strict malformed-response reader regressions
        run: python3 tests/security/test_boundary_transport.py
      - name: Disposable HTTP, fake-provider AI and managed API regressions
        run: |
          (umask 077; : > "$RUNNER_TEMP/api-tests.log")
          if ! bash tests/security/run.sh > "$RUNNER_TEMP/api-tests.log" 2>&1; then
            echo 'FAIL: local HTTP/AI/managed API regressions; runtime details withheld.'
            python3 tests/security/report_failure.py --stage api "$RUNNER_TEMP/api-tests.log"
            exit 1
          fi
          echo 'PASS: 13 HTTP, six fake-provider AI and seven managed API groups; SQLite checks.'

  transport-smoke:
    name: Real two-process Linux transport and expiry
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Prepare verified dependencies before the transport smoke
        run: |
          go mod download
          go mod verify
      - name: Real two-process Linux transport and 120-second expiry
        run: |
          if ! python3 tests/security/run_transport_smoke.py --wait-stale > "$RUNNER_TEMP/transport-smoke.log" 2>&1; then
            echo 'FAIL: local transport smoke; raw output withheld to avoid telemetry disclosure.'
            python3 tests/security/report_failure.py --stage transport "$RUNNER_TEMP/transport-smoke.log"
            exit 1
          fi
          echo 'PASS: 14 real two-process transport checks including actual expiry; no telemetry uploaded.'


  frontend:
    name: UI types, tests and production build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Unit and interaction tests
        run: npm test
      - name: Independent UI regression tests
        working-directory: .
        run: ./web/node_modules/.bin/vitest run --config tests/e2e-review/vitest.config.mts
      - name: Verify public installation and browser fixture contracts without executing commands
        working-directory: .
        run: |
          node tests/e2e-review/check-inert-suites.mjs --self-test
          node tests/e2e-review/check-inert-suites.mjs
          node --test tests/e2e-review/public-command-contract.test.mjs
          node --test tests/e2e-review/windows-inventory-fixtures.test.mjs tests/e2e-review/resource-history-fixtures.test.mjs tests/e2e-review/application-check-settings-fixtures.test.mjs tests/e2e-review/investigations-fixtures.test.mjs tests/e2e-review/alarm-browser-diagnostics.test.mjs tests/e2e-review/browser-transport-diagnostics.test.mjs tests/e2e-review/alarm-settings-fixtures.test.mjs tests/e2e-review/cve-continuation-fixtures.test.mjs tests/e2e-review/cve-detail-pages-fixtures.test.mjs tests/e2e-review/proactive-ai-fixtures.test.mjs tests/e2e-review/journal-ai-fixtures.test.mjs tests/e2e-review/package-updates-fixtures.test.mjs tests/e2e-review/journal-browse-fixtures.test.mjs tests/e2e-review/windows-contact-history-fixtures.test.mjs
      - name: Production build
        run: npm run build

  browser:
    name: Same-origin browser acceptance and screenshots
    needs: [frontend]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Build UI from locked dependencies
        working-directory: web
        run: npm ci && npm run build
      - name: Install Playwright Chromium on hosted runner
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Test real loopback manager with disposable state
        env:
          TRACEBOLT_SOURCE_SHA: ${{ github.sha }}
          TRACEBOLT_REVIEW_AI: '1'
        run: node tests/e2e-review/run.mjs
      - name: Real managed-preview browser checks without telemetry screenshots
        if: ${{ !cancelled() }}
        env:
          TRACEBOLT_SOURCE_SHA: ${{ github.sha }}
        run: node tests/e2e-review/managed-preview.mjs
      - name: Authenticated HTTP-test UI, language and warning checks
        if: ${{ !cancelled() }}
        env:
          TRACEBOLT_SOURCE_SHA: ${{ github.sha }}
        run: node tests/e2e-review/lan-browser.mjs
      - name: Guided enrollment reduced browser gate (10 required, 3 quarantined)
        if: ${{ !cancelled() }}
        env:
          TRACEBOLT_SOURCE_SHA: ${{ github.sha }}
        run: node tests/e2e-review/enrollment-browser.mjs
      - name: Synthetic operational, package and conditional-review browser acceptance
        if: ${{ !cancelled() }}
        env:
          TRACEBOLT_SOURCE_SHA: ${{ github.sha }}
          TRACEBOLT_REVIEW_LIFECYCLE_REPEATS: '5'
        run: node tests/e2e-review/conditional-browser.mjs
      - name: Require complete exact-source conditional browser evidence
        if: ${{ !cancelled() }}
        env:
          TRACEBOLT_SOURCE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import json, os
          try:
              with open('artifacts/review/conditional-browser-results.json', 'rb') as stream:
                  raw = stream.read(131073)
              if not 0 < len(raw) <= 131072:
                  raise ValueError('invalid size')
              value = json.loads(raw)
              summary = value.get('summary', {})
              results = value.get('results', [])
              if value.get('sourceSha') != os.environ['TRACEBOLT_SOURCE_SHA']:
                  raise ValueError('wrong source')
              if type(value.get('runtimeErrorCount')) is not int or value['runtimeErrorCount'] != 0:
                  raise ValueError('runtime errors')
              if value.get('secretsExported') is not False or value.get('realTelemetryExported') is not False:
                  raise ValueError('invalid export scope')
              if type(summary.get('passed')) is not int or summary['passed'] != 19 or type(summary.get('failed')) is not int or summary['failed'] != 0 or summary.get('setupFailure') is not False:
                  raise ValueError('incomplete summary')
              if not isinstance(results, list) or len(results) != 19:
                  raise ValueError('wrong case count')
              names = set()
              for result in results:
                  if result.get('status') != 'PASS' or not isinstance(result.get('name'), str) or not result['name'] or result['name'] in names:
                      raise ValueError('invalid case')
                  names.add(result['name'])
          except Exception:
              raise SystemExit('FAIL: missing, partial, mismatched or unsafe conditional-browser evidence.')
          print('PASS:19 unique conditional-browser cases on the exact commit, with zero runtime errors and no secret/real telemetry export.')
          PYTHON
      - name: V3 main-flow browser acceptance with invented inventory
        if: ${{ !cancelled() }}
        env:
          TRACEBOLT_SOURCE_SHA: ${{ github.sha }}
        run: node tests/e2e-review/v3-mvp-browser.mjs
      - name: Require complete exact-source v3 browser evidence
        if: ${{ !cancelled() }}
        env:
          TRACEBOLT_SOURCE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import json, os
          try:
              with open('artifacts/review/v3-mvp-browser-results.json', 'rb') as stream:
                  raw = stream.read(131073)
              if not 0 < len(raw) <= 131072:
                  raise ValueError('invalid size')
              value = json.loads(raw)
              summary = value.get('summary', {})
              results = value.get('results', [])
              if value.get('sourceSha') != os.environ['TRACEBOLT_SOURCE_SHA']:
                  raise ValueError('wrong source')
              if type(value.get('runtimeErrorCount')) is not int or value['runtimeErrorCount'] != 0:
                  raise ValueError('runtime errors')
              for key in ('secretsExported', 'realTelemetryExported', 'installerExecuted', 'nativeCollectorExecuted', 'userVmAccessed'):
                  if value.get(key) is not False:
                      raise ValueError('invalid execution or export scope')
              if type(summary.get('passed')) is not int or summary['passed'] != 10 or type(summary.get('failed')) is not int or summary['failed'] != 0 or summary.get('setupFailure') is not False:
                  raise ValueError('incomplete summary')
              if not isinstance(results, list) or len(results) != 10:
                  raise ValueError('wrong case count')
              names = set()
              for result in results:
                  if result.get('status') != 'PASS' or not isinstance(result.get('name'), str) or not result['name'] or result['name'] in names:
                      raise ValueError('invalid case')
                  names.add(result['name'])
          except Exception:
              raise SystemExit('FAIL: missing, partial, mismatched or unsafe v3-browser evidence.')
          print('PASS:10 unique v3 browser cases on the exact commit; invented data, zero runtime errors and no native/installer/VM execution.')
          PYTHON
      - name: Endpoint hostname and interface browser acceptance
        env:
          TRACEBOLT_SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 tests/security/test_endpoint_browser_gate.py
          python3 -O tests/security/test_endpoint_browser_gate.py
          node tests/e2e-review/endpoint-identity-browser.mjs
          python3 tests/security/check_endpoint_browser_gate.py artifacts/review/endpoint-browser-results.json
      - name: Fleet hostname and scoped IP browser acceptance
        if: ${{ !cancelled() }}
        env:
          TRACEBOLT_SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          node tests/e2e-review/fleet-identity-browser.mjs
          python3 - <<'PYTHON'
          import json, os
          from pathlib import Path
          try:
              raw = Path('artifacts/review/fleet-identity-browser-results.json').read_bytes()
              if not 0 < len(raw) <= 1024 * 1024:
                  raise ValueError('invalid size')
              value = json.loads(raw)
              if value.get('sourceSha') != os.environ['TRACEBOLT_SOURCE_SHA']:
                  raise ValueError('wrong source')
              if type(value.get('runtimeErrorCount')) is not int or value['runtimeErrorCount'] != 0:
                  raise ValueError('runtime errors')
              for key in ('secretsExported', 'realTelemetryExported', 'collectorExecuted', 'consentFilesWritten', 'installerExecuted', 'userVmAccessed'):
                  if value.get(key) is not False:
                      raise ValueError('invalid scope')
              summary = value.get('summary', {})
              if type(summary.get('passed')) is not int or summary['passed'] != 5 or type(summary.get('failed')) is not int or summary['failed'] != 0 or summary.get('setupFailure') is not False:
                  raise ValueError('incomplete summary')
              cases = value.get('results')
              if not isinstance(cases, list) or len(cases) != 5:
                  raise ValueError('wrong case count')
              names = set()
              for case in cases:
                  name = case.get('name')
                  if case.get('status') != 'PASS' or not isinstance(name, str) or not name or name in names:
                      raise ValueError('invalid case')
                  names.add(name)
          except Exception:
              raise SystemExit('FAIL: incomplete, mismatched or unsafe fleet browser evidence.')
          print('PASS: five fleet identity browser cases on the exact source; invented metadata only.')
          PYTHON
      - name: Journal request, snapshot and lifecycle browser acceptance
        if: ${{ !cancelled() }}
        env:
          TRACEBOLT_SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 tests/security/test_journal_browser_gate.py
