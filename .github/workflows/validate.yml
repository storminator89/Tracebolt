  container:
    name: Linux manager container lifecycle (${{ matrix.arch }}, TLS and HTTP test)
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
            machine: x86_64
          - runner: ubuntu-24.04-arm
            arch: arm64
            machine: aarch64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Build and verify the native Linux image without registry publication
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
          EXPECTED_MACHINE: ${{ matrix.machine }}
        run: |
          test "$(uname -m)" = "$EXPECTED_MACHINE"
          test "$(go env GOHOSTARCH)" = "$EXPECTED_ARCH"
          docker build --platform "linux/$EXPECTED_ARCH" --tag tracebolt-manager:ci .
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' tracebolt-manager:ci)" = "linux/$EXPECTED_ARCH"
      - name: Exercise both disposable container profiles
        run: |
          if ! TRACEBOLT_CONTAINER_IMAGE=tracebolt-manager:ci go test -count=1 -v ./tests/container > "$RUNNER_TEMP/container-tests.log" 2>&1; then
            echo 'FAIL: container lifecycle; fixture material and raw logs withheld.'
            sed -nE 's/^--- FAIL: (Test[A-Za-z0-9_]+) .*/FAIL: \1/p' "$RUNNER_TEMP/container-tests.log"
            exit 1
          fi
          echo 'PASS: TLS and explicit HTTP-test container lifecycle, durable approval/replay/revocation and nonroot runtime.'

  action-native-ipc:
    name: Required Linux service-action IPC (no skips)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Verify the strict native IPC evidence checker
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          python3 tests/security/test_action_ipc_gate.py
          python3 -O tests/security/test_action_ipc_gate.py
      - name: Prepare pinned dependencies as the ordinary hosted user
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          test "$(id -g)" -ne 0
          go mod download
          go mod verify
      - name: Require real Unix credentials and inherited listeners without skips
        env:
          TRACEBOLT_REQUIRE_NATIVE_ACTION_IPC: '1'
          GOTOOLCHAIN: local
          GOPROXY: 'off'
          GOSUMDB: 'off'
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          test "$(id -g)" -ne 0
          SOURCE_SHA=$(git rev-parse --verify HEAD)
          test "$SOURCE_SHA" = "$GITHUB_SHA"
          (umask 077; : > "$RUNNER_TEMP/action-ipc.jsonl"; : > "$RUNNER_TEMP/action-ipc.stderr")
          status=0
          go test -race -json -buildvcs=false ./internal/actionhelper ./internal/actionclient -run '^(TestAuthorityKernelPeerCredentials|TestAuthorityInheritedListenerFixture|TestAuthorityInheritedListenerRejectsMismatch|TestCredentialReaderNativePasscredRejectsNonRootWriter)$' -count=1 -timeout=2m > "$RUNNER_TEMP/action-ipc.jsonl" 2> "$RUNNER_TEMP/action-ipc.stderr" || status=$?
          python3 tests/security/check_action_ipc_gate.py "$RUNNER_TEMP/action-ipc.jsonl" --go-exit-code "$status" --source-sha "$SOURCE_SHA"
