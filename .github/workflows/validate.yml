  go-race:
    name: Go race shard (${{ matrix.shard }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Prepare verified race dependencies
        run: |
          go mod download
          go mod verify
      - name: Run an exact source-bound package partition
        env:
          GOTOOLCHAIN: local
          GOPROXY: 'off'
          GOSUMDB: 'off'
          TRACEBOLT_GO_SHARD: ${{ matrix.shard }}
        run: python3 -I -B tests/security/go_race_shards.py --shard "$TRACEBOLT_GO_SHARD" --report "$RUNNER_TEMP/go-race-report/completion.json"
      - name: Upload normalized completion evidence only
        id: completion-upload
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: go-race-${{ github.run_attempt }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/go-race-report/completion.json
          if-no-files-found: error
          retention-days: 1
      # Retry only transport, with unchanged bytes. A distinct name avoids
      # deleting/overwriting an artifact whose first finalize was uncertain.
      # This step is not continue-on-error: two failed uploads fail the job.
      - name: Retry normalized completion upload once
        if: ${{ !cancelled() && steps.completion-upload.outcome == 'failure' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: go-race-${{ github.run_attempt }}-${{ matrix.shard }}-fallback
          path: ${{ runner.temp }}/go-race-report/completion.json
          if-no-files-found: error
          retention-days: 1

  backend:
    name: Go tests and build-only platform checks
    if: ${{ always() }}
    needs: [backend-checks, go-race, package-dense-race]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Require successful runtime and race prerequisites
        env:
          TRACEBOLT_GO_NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 -I -B tests/security/go_race_shards.py --check-needs
      - name: Download this attempt's normalized race evidence
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: go-race-${{ github.run_attempt }}-*
          path: ${{ runner.temp }}/go-race-results
          merge-multiple: false
      - name: Prepare independent package discovery
        run: |
          go mod download
          go mod verify
      - name: Require exact complete race coverage and successful runtime checks
        env:
          GOTOOLCHAIN: local
          GOPROXY: 'off'
          GOSUMDB: 'off'
          TRACEBOLT_GO_NEEDS: ${{ toJSON(needs) }}
        run: python3 -I -B tests/security/go_race_shards.py --verify "$RUNNER_TEMP/go-race-results"

