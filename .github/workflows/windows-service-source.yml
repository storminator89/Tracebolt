name: Windows service source fixtures

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: windows-service-source-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pure-windows-fixtures:
    name: Windows state/SCM/console source fixtures (no host grants or installation)
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Run injected and in-memory fixtures only
        env:
          GOTOOLCHAIN: local
          PYTHONDONTWRITEBYTECODE: '1'
        run: python tests/security/run_windows_service_source.py
      - name: Observe isolated fixed-public-output ConPTY rendering (no service or identity)
        timeout-minutes: 3
        env:
          GOTOOLCHAIN: local
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -I -B tests/security/run_public_conpty_probe.py
      - name: Observe read-only KnownFolder child environment (no service or identity)
        timeout-minutes: 3
        env:
          GOTOOLCHAIN: local
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -I -B tests/security/run_knownfolder_probe.py
