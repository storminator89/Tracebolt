                  frozenset('dead running exited failed auto-restart auto-restart-queued start-pre start start-post stop stop-sigterm stop-sigkill stop-post final-sigterm final-sigkill reload reload-signal reload-notify listening start-chown stop-pre stop-pre-sigterm stop-pre-sigkill unknown unavailable invalid'.split()),
                  frozenset('success resources protocol timeout exit-code signal core-dump watchdog start-limit-hit oom-kill exec-condition skip-condition unknown unavailable invalid'.split()),
              )
              lifecycle_pattern = re.compile(r'[ \t]+[A-Za-z0-9_]+\.go:[0-9]+: native_lifecycle operation=([a-z_]+) failureStage=([a-z0-9_-]+) committed=([a-z]+) rolledBack=([a-z]+) identityRetained=([a-z]+) unit=([a-z_]+) activeState=([a-z]+) subState=([a-z-]+) result=([a-z-]+)')
              lifecycle_booleans = {'true': True, 'false': False, 'unavailable': None}
              try:
                  fd = os.open(path, os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK | os.O_CLOEXEC)
                  with os.fdopen(fd, 'rb') as stream:
                      info = os.fstat(stream.fileno())
                      if not stat.S_ISREG(info.st_mode) or not 0 < info.st_size <= 1048576:
                          return 'private-diagnostic-unavailable', [], []
                      raw = stream.read(1048577)
                  if len(raw) != info.st_size or len(raw) > 1048576:
                      return 'private-diagnostic-unavailable', [], []
                  assertion, failures, seen = 'no-known-native-assertion', [], set()
                  lifecycle_failures, lifecycle_seen = [], set()
                  for line in raw.decode('utf-8', errors='replace').splitlines():
                      match = re.fullmatch(r'\s+[^\s/]+\.go:[0-9]+: (.+)', line)
                      if assertion == 'no-known-native-assertion' and match and match[1] in allowed:
                          assertion = match[1]
                      diagnostic = pattern.fullmatch(line)
                      if diagnostic and len(failures) < 8:
                          values = diagnostic.groups()
                          if values not in seen and all(value in allowed_values for value, allowed_values in zip(values, choices)):
                              failures.append(dict(zip(fields, values)))
                              seen.add(values)
                      lifecycle = lifecycle_pattern.fullmatch(line)
                      if lifecycle and len(lifecycle_failures) < 8:
                          values = lifecycle.groups()
                          if values not in lifecycle_seen and all(value in allowed_values for value, allowed_values in zip(values, lifecycle_choices)):
                              record = dict(zip(lifecycle_fields, values))
                              for field in ('committed', 'rolledBack', 'identityRetained'):
                                  record[field] = lifecycle_booleans[record[field]]
                              lifecycle_failures.append(record)
                              lifecycle_seen.add(values)
                  return assertion, failures, lifecycle_failures
              except Exception:
                  return 'private-diagnostic-unavailable', [], []
          try:
              check(len(sys.argv) == 6)
              check(sys.argv[2] in {'tls', 'http-test'})
              check(sys.argv[3] in {'complete', 'cancel-enrollment', 'retained-journal'})
              check(sys.argv[4] == 'tracebolt.linux-read-admin.v2')
              check(re.fullmatch(r'[0-9a-f]{40}', sys.argv[5]) is not None)
              fd = os.open(sys.argv[1], os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK | os.O_CLOEXEC)
              with os.fdopen(fd, 'rb') as stream:
                  info = os.fstat(stream.fileno())
                  check(stat.S_ISREG(info.st_mode) and 0 < info.st_size <= 4096)
                  raw = stream.read(4097)
              check(0 < len(raw) <= 4096 and len(raw) == info.st_size)
              value = json.loads(raw, object_pairs_hook=unique_object)
              check(type(value) is dict)
              check(set(value) == {'schemaVersion', 'status', 'stage', 'profile', 'collectionProfile', 'scenario', 'osRebootTested', 'telemetryExported', 'readProfile', 'sourceCommit', 'ptraceRiskAcknowledged', 'socketNativeChecks', 'initialProbe', 'setupFailure'})
              check(value['schemaVersion'] == 'tracebolt.read-admin-systemd-acceptance.v2')
              check(value['profile'] == sys.argv[2])
              check(value['collectionProfile'] == 'managed-operations-v3')
              check(value['scenario'] == sys.argv[3])
              check(value['readProfile'] == sys.argv[4])
              check(value['sourceCommit'] == sys.argv[5])
              check(value['ptraceRiskAcknowledged'] is True)
