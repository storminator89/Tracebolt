              fields = ('method', 'resource', 'status', 'failure', 'code')
              choices = (
                  frozenset('get post'.split()),
                  frozenset('auth enrollment invitation approval devices packages operational system system_query overview endpoint_identity journal journal_create journal_query other'.split()),
                  frozenset('not_received http_200 http_201 http_400 http_401 http_403 http_404 http_405 http_409 http_429 http_500 http_503 http_other'.split()),
                  frozenset('request transport deadline body oversize status decode'.split()),
                  frozenset('none unknown invalid storage_busy journal_busy authentication_required journal_not_configured invalid_journal_request journal_conflict journal_unavailable journal_generation_stale journal_not_ready journal_not_found not_found method_not_allowed forbidden invalid_request inventory_not_configured invalid_inventory_query inventory_page_limit inventory_generation_expired inventory_unavailable invalid_query overview_not_configured overview_page_limit invalid_overview_query overview_resource_limit overview_generation_expired overview_unavailable complete_updates_not_configured'.split()),
              )
              pattern = re.compile(r'[ \t]+[A-Za-z0-9_]+\.go:[0-9]+: native_operator method=([a-z]+) resource=([a-z_]+) status=([a-z0-9_]+) failure=([a-z]+) code=([a-z_]+)')
              lifecycle_fields = ('operation', 'failureStage', 'committed', 'rolledBack', 'identityRetained', 'unit', 'activeState', 'subState', 'result')
              lifecycle_stages = frozenset('''preflight_inspect preflight_systemd preflight_terminal preflight_systemctl_tool preflight_useradd_tool preflight_nologin_tool preflight_opt_directory preflight_etc_directory preflight_state_directory preflight_unit_directory preflight_unit_status preflight_account preflight_installation_state preflight_ownership_state preflight_fresh_paths preflight_bootstrap preflight_complete_profile preflight_artifacts preflight_plan preflight_begin preflight_reinspect preflight_replan preflight_unit_command preflight_unit_members preflight_unit_pid preflight_unit_absence preflight_manifest_absence preflight_begin_request preflight_begin_control preflight_begin_lock preflight_begin_journal preflight_begin_entropy preflight_begin_ownership preflight_begin_unit preflight_begin_artifacts preflight_begin_bootstrap preflight_begin_save stop_owned_service validate_existing_guided_state start_owned_service disable_owned_service remove_owned_installation_files commit reset_owned_service_restart_state none invalid'''.split()) | setup_failures
              lifecycle_choices = (
                  frozenset('restart_preflight restart_apply uninstall_cleanup inspect_socket revoke_socket helper_cleanup'.split()),
                  lifecycle_stages,
                  frozenset('true false unavailable'.split()),
                  frozenset('true false unavailable'.split()),
                  frozenset('true false unavailable'.split()),
