name: Manual current21 TLS Windows Setup GUI acceptance

# Distinct CURRENT21 renewable TLS source candidate. Historical five-scope
# reports and its old four-case aggregation remain unchanged and cannot pass here.
# No publication/publisher eligibility follows; no Windows11 or Linux manager proof.

# A separate exact-source consent contract; never push, pull_request, schedule,
# workflow_call, workflow_run or the old coordinator-only acceptance approval.
on:
  workflow_dispatch:
    inputs:
      expected_source_sha:
        description: 'Exact independently reviewed 40-hex source SHA; must equal this dispatch. Three assigned fresh hosted Windows 2025 x64 VMs only, first attempt.'
        required: true
        type: string
      app_acls:
        description: 'Approve real Setup.exe creating app-only Program Files/ProgramData roots, payload and protected stores; no ancestor repair, adoption or user computer'
        required: true
        default: false
        type: boolean
      services:
        description: 'Approve fixed LocalService SCM identity/SID/limited privileges, Disabled staging, exact automatic transition/Start on approved fresh VMs only'
        required: true
        default: false
        type: boolean
      identity:
        description: 'Approve persistent endpoint keys/identity and twenty-one exact scope grants, fixture public fingerprint/comparison approval; no production manager identity'
        required: true
        default: false
        type: boolean
      twenty_one_read_admin_scopes:
        description: 'Approve CURRENT21 Read admin consent v14/receipt12, including personal session labels, chassis/BIOS serials, storage identifiers, AV/TPM, routes/raw counters, CPU/RAM/pagefile/storage IO, complete process/service/HKLM software and history, bounded Application/System history and sensitive selected historical messages; no actual history/message request, sampled-event content, cached-update inspection, installs, service control or user helper'
        required: true
        default: false
        type: boolean
      synthetic_console:
        description: 'Approve actual GUI controls and memory-only synthetic invitation events at true hidden CONIN$, bounded no-echo inspection, owned GUI worker termination; no human invite/UAC claim'
        required: true
        default: false
        type: boolean
      loopback_tls:
        description: 'Approve disposable loopback TLS fixture authority and reports for TLS cases only; no real Linux manager/dashboard, firewall, global trust or network policy changes'
        required: true
        default: false
        type: boolean
      automatic_renewal:
        description: 'Separately approve fresh same-key automatic renewal consent and public manifest, normal initial TLS credential lifetime, original scopes/horizon; no renewal cutover claim, retained-host or multi-day run'
        required: true
        default: false
        type: boolean
      stop_remove_owned_service:
        description: 'Approve GUI-confirmed stop/delete of exact completed receipt-owned service, observable delete-pending and final absence; reject incomplete uninstalls; no files/keys/state deletion'
        required: true
        default: false
        type: boolean
      retain_for_vm_disposal:
        description: 'Approve retaining installed executable, bootstrap, identity/grants/state and any incomplete service for platform VM disposal. Disposal required but unverified; no reuse/reboot/upgrade'
        required: true
        default: false
        type: boolean
permissions:
  contents: read
jobs:
  packaged-gui:
    name: Actual packaged GUI - ${{ matrix.case }}
    if: ${{ github.event_name == 'workflow_dispatch' && github.repository == 'storminator89/Tracebolt' && github.repository_owner == 'storminator89' && github.repository_owner_id == '30489872' && github.actor == 'storminator89' && github.actor_id == '30489872' && github.triggering_actor == 'storminator89' && github.run_attempt == 1 }}
    strategy:
      fail-fast: false
      matrix:
        case: [install-uninstall, cancel-hidden-input, pending-transport]
    runs-on: windows-2025
    timeout-minutes: 40
    env:
      TRACEBOLT_SETUP_SOURCE: ${{ inputs.expected_source_sha }}
      TRACEBOLT_SETUP_PROFILE: packaged-setup-gui-read-admin-current-v3
      TRACEBOLT_SETUP_CASE: ${{ matrix.case }}
      TRACEBOLT_SETUP_APPROVE_APP_ACLS: ${{ inputs.app_acls }}
      TRACEBOLT_SETUP_APPROVE_SERVICES: ${{ inputs.services }}
      TRACEBOLT_SETUP_APPROVE_IDENTITY: ${{ inputs.identity }}
      TRACEBOLT_SETUP_APPROVE_TWENTY_ONE_READ_ADMIN_SCOPES: ${{ inputs.twenty_one_read_admin_scopes }}
      TRACEBOLT_SETUP_APPROVE_SYNTHETIC_CONSOLE: ${{ inputs.synthetic_console }}
      TRACEBOLT_SETUP_APPROVE_LOOPBACK_TLS: ${{ inputs.loopback_tls }}
      TRACEBOLT_SETUP_APPROVE_AUTOMATIC_RENEWAL: ${{ inputs.automatic_renewal }}
      TRACEBOLT_SETUP_APPROVE_STOP_REMOVE_OWNED_SERVICE: ${{ inputs.stop_remove_owned_service }}
      TRACEBOLT_SETUP_APPROVE_RETAIN_FOR_VM_DISPOSAL: ${{ inputs.retain_for_vm_disposal }}
      PYTHONDONTWRITEBYTECODE: '1'
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Require all distinct approvals and exact clean source before further work
        shell: pwsh
        run: python -I -B tests/windows_native_acceptance/run_current_setup_gui.py --check-authorization
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Inert authorization and report fixtures
        shell: pwsh
        run: |
          python -I -B -m unittest discover -s tests/windows_native_acceptance -p "test_current_setup*.py"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go test ./internal/windowsacceptance/currentsetupgate ./internal/windowsacceptance/fixture -count=1
          exit $LASTEXITCODE
      - name: Build exact package and drive actual GUI; fail blocked if no interactive desktop
        id: gui
        shell: pwsh
        run: python -I -B tests/windows_native_acceptance/run_current_setup_gui.py --run-native
      - name: Export finite evidence only; platform disposal remains unverified
        if: ${{ always() && !cancelled() && steps.gui.outputs.report_validated == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: windows-current-setup-gui-${{ matrix.case }}-${{ github.sha }}
          path: ${{ runner.temp }}/tracebolt-windows-current-setup-acceptance.json
          if-no-files-found: error
          retention-days: 3

      - name: Retain only the exact successful TLS-case public package, pending all-case validation
        if: ${{ success() && matrix.case == 'install-uninstall' && steps.gui.outputs.public_package_validated == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: windows-current-setup-public-input-${{ github.sha }}
          path: |
            ${{ runner.temp }}/tracebolt-current-setup-tested-public/Tracebolt-v0.0.0-setup-candidate-windows-amd64-Setup.exe
            ${{ runner.temp }}/tracebolt-current-setup-tested-public/tracebolt-v0.0.0-setup-candidate-windows-amd64-service.exe
            ${{ runner.temp }}/tracebolt-current-setup-tested-public/setup-package-amd64.json
            ${{ runner.temp }}/tracebolt-current-setup-tested-public/build-manifest.json
            ${{ runner.temp }}/tracebolt-current-setup-tested-public/source-inputs.json
            ${{ runner.temp }}/tracebolt-current-setup-tested-public/SHA256SUMS
          if-no-files-found: error
          retention-days: 3
  accepted-public-package:
    name: Validate three current reports and preserve exact tested public bytes (no rebuild)
    needs: packaged-gui
    if: ${{ github.event_name == 'workflow_dispatch' && needs.packaged-gui.result == 'success' && github.run_attempt == 1 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    env:
      TRACEBOLT_SETUP_SOURCE: ${{ inputs.expected_source_sha }}
      TRACEBOLT_SETUP_PROFILE: packaged-setup-gui-read-admin-current-v3
      TRACEBOLT_SETUP_APPROVE_APP_ACLS: ${{ inputs.app_acls }}
      TRACEBOLT_SETUP_APPROVE_SERVICES: ${{ inputs.services }}
      TRACEBOLT_SETUP_APPROVE_IDENTITY: ${{ inputs.identity }}
      TRACEBOLT_SETUP_APPROVE_TWENTY_ONE_READ_ADMIN_SCOPES: ${{ inputs.twenty_one_read_admin_scopes }}
      TRACEBOLT_SETUP_APPROVE_SYNTHETIC_CONSOLE: ${{ inputs.synthetic_console }}
      TRACEBOLT_SETUP_APPROVE_LOOPBACK_TLS: ${{ inputs.loopback_tls }}
      TRACEBOLT_SETUP_APPROVE_AUTOMATIC_RENEWAL: ${{ inputs.automatic_renewal }}
      TRACEBOLT_SETUP_APPROVE_STOP_REMOVE_OWNED_SERVICE: ${{ inputs.stop_remove_owned_service }}
      TRACEBOLT_SETUP_APPROVE_RETAIN_FOR_VM_DISPOSAL: ${{ inputs.retain_for_vm_disposal }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Download current-run reports into separate case directories
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: windows-current-setup-gui-*-${{ github.sha }}
          path: ${{ runner.temp }}/tracebolt-current-setup-reports
          merge-multiple: false
      - name: Download the current-run exact successful TLS public package
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: windows-current-setup-public-input-${{ github.sha }}
          path: ${{ runner.temp }}/tracebolt-current-setup-package-input
      - name: Verify same source/run, all three current cases, artifact equality and public package bytes
        id: aggregate
        env:
          TRACEBOLT_SETUP_API_TOKEN: ${{ github.token }}
        run: python -I -B tests/windows_native_acceptance/run_current_setup_gui.py --aggregate
      - name: Preserve exact tested unsigned source-candidate native-subset package
        if: ${{ success() && steps.aggregate.outputs.accepted_package_validated == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: windows-current-setup-native-subset-public-${{ github.sha }}
          path: |
            ${{ runner.temp }}/tracebolt-current-setup-accepted-public/Tracebolt-v0.0.0-setup-candidate-windows-amd64-Setup.exe
            ${{ runner.temp }}/tracebolt-current-setup-accepted-public/tracebolt-v0.0.0-setup-candidate-windows-amd64-service.exe
            ${{ runner.temp }}/tracebolt-current-setup-accepted-public/setup-package-amd64.json
            ${{ runner.temp }}/tracebolt-current-setup-accepted-public/build-manifest.json
            ${{ runner.temp }}/tracebolt-current-setup-accepted-public/source-inputs.json
            ${{ runner.temp }}/tracebolt-current-setup-accepted-public/SHA256SUMS
          if-no-files-found: error
          retention-days: 7
      - name: Preserve finite cross-case linkage evidence separately
        if: ${{ success() && steps.aggregate.outputs.accepted_package_validated == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: windows-current-setup-native-subset-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/tracebolt-current-setup-native-subset.json
          if-no-files-found: error
          retention-days: 7
