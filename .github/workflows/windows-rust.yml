name: Rust Windows basic agent
on:
  workflow_dispatch:
  push:
    branches: ['main', 'codex/integrated-rust-test-candidate']
  pull_request:
    paths:
      - 'rust/windows-agent/**'
      - 'deploy/windows-rust/**'
      - 'tests/rustagent/**'
      - 'internal/**'
      - 'cmd/lan-manager/**'
      - 'web/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/windows-rust.yml'
concurrency:
  group: rust-windows-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - working-directory: rust/windows-agent
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
          cargo run --locked --example wire_fixture > ../../tests/rustagent/fixture.json
          cargo run --locked --example enrollment_fixture > ../../tests/rustagent/enrollment-fixture.json
      - run: go test ./tests/rustagent ./internal/enrollmentstore ./internal/enrollmentservice ./internal/api
        timeout-minutes: 12
      - name: Disposable Go/Rust TLS activation-stop-resume contract
        run: |
          go build -o "$RUNNER_TEMP/tracebolt-runtime-peer" ./tests/rustagent/cmd/nativefixture
          cd rust/windows-agent
          cargo run --locked --example runtime_stop_fixture -- "$RUNNER_TEMP/tracebolt-runtime-peer"
      - run: python3 -B tests/rustagent/test_release_manifest.py
  manager-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - name: Build matching manager and frontend from this commit
        run: |
          (cd web && npm ci --ignore-scripts && npm run build)
          mkdir -p artifacts/manager-linux-amd64
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -buildvcs=false -trimpath -ldflags='-s -w' -o artifacts/manager-linux-amd64/manager ./cmd/lan-manager
          cp -R web/dist artifacts/manager-linux-amd64/web
          cp -R deploy docs artifacts/manager-linux-amd64/
          cp LICENSE artifacts/manager-linux-amd64/
          printf '%s\n' "$GITHUB_SHA" > artifacts/manager-linux-amd64/SOURCE-COMMIT.txt
          tar -C artifacts/manager-linux-amd64 -czf artifacts/manager-linux-amd64.tar.gz .
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: tracebolt-matching-manager-linux-amd64
          path: artifacts/manager-linux-amd64.tar.gz
          if-no-files-found: error
  windows-package:
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Test and build unsigned package (no installation or native collection)
        shell: pwsh
        run: |
          ./tests/rustagent/Test-PackageStaging.ps1
          ./deploy/windows-rust/Build-Package.ps1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - name: Disposable Windows service acceptance
        shell: pwsh
        run: ./tests/rustagent/Run-NativeAcceptance.ps1 -PackageArchive ./artifacts/windows-rust.zip
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: tracebolt-rust-windows-native-evidence
          path: artifacts/windows-rust-native.json
          if-no-files-found: warn
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: tracebolt-rust-windows-x64-unsigned
          path: artifacts/windows-rust.zip
          if-no-files-found: error
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [contracts, manager-package, windows-package]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: tracebolt-rust-windows-x64-unsigned
          path: release
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: tracebolt-matching-manager-linux-amd64
          path: release
      - name: Publish tested unsigned Windows prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.sha }}
          GH_REPO: ${{ github.repository }}
        run: |
          unzip -q release/windows-rust.zip -d release/package
          (cd release/package && sha256sum -c SHA256SUMS.txt)
          cp release/package/tracebolt-windows-agent.exe release/
          python3 deploy/windows-rust/write-release-manifest.py release "$RELEASE_SHA" "$GITHUB_RUN_ID"
          (cd release && sha256sum windows-rust.zip manager-linux-amd64.tar.gz tracebolt-windows-agent.exe release-manifest.json > SHA256SUMS.txt)
          tag="v0.1.0-integrated-rust-test.${RELEASE_SHA:0:12}.${GITHUB_RUN_ID}"
          gh release create "$tag" \
            release/windows-rust.zip \
            release/manager-linux-amd64.tar.gz \
            release/tracebolt-windows-agent.exe \
            release/release-manifest.json \
            release/SHA256SUMS.txt \
            --target "$RELEASE_SHA" --prerelease \
            --title "Integrated Rust Windows test candidate ${RELEASE_SHA:0:12}" \
            --notes-file deploy/windows-rust/RELEASE-NOTES.md
