name: Build unsigned Windows Setup candidates

on:
  push:
    branches: [main]
  pull_request:

# Existing build job compiles/uploads only. The separately authorized PR201-only
# job adds one inert TLS GUI test. No Setup/service image is executed; no OIDC,
# signing, release-write, host grant, keys, services or user-machine access.
permissions:
  contents: read

concurrency:
  group: windows-setup-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Deterministic x64 and ARM64 Setup artifacts (never executed)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GOTOOLCHAIN: local
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Check packaging and resource negative fixtures
        run: python3 -I -B -m unittest discover -s tests/windows_setup -v
      - name: Check portable source fixtures without Windows host operations
        run: >-
          go test -race -buildvcs=false
          ./internal/windowsservice ./internal/windowsstate ./internal/windowsconsole
          ./internal/windowspath ./internal/windowspackage ./internal/windowssetup
          ./internal/windowssetupui ./cmd/windows-service
      - name: Cross-build both architectures twice and inspect actual PE resources
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: >-
          python3 -I -B deploy/windows-setup/build-setup.py
          --version v0.0.0-setup-candidate
          --source-commit "$SOURCE_COMMIT"
          --output "$RUNNER_TEMP/tracebolt-windows-setup"
      - name: Build separate foreground helper candidates (never executed or installed)
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/tracebolt-windows-user-software"
          mkdir "$output"
          for arch in amd64 arm64; do
            GOOS=windows GOARCH="$arch" CGO_ENABLED=0 go build -mod=readonly -buildvcs=false -trimpath -o "$output/tracebolt-windows-user-software-$arch.exe" ./cmd/windows-user-software
          done
          printf '%s\n' "${{ github.sha }}" > "$output/SOURCE_COMMIT"
          (cd "$output" && sha256sum *.exe > SHA256SUMS)
      - name: Preserve separate unsigned foreground helpers for review
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: unsigned-windows-selected-user-software-helpers
          path: ${{ runner.temp }}/tracebolt-windows-user-software/
          if-no-files-found: error
          retention-days: 7
      - name: Preserve unsigned source candidates for review
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: unsigned-windows-setup-candidates
          path: ${{ runner.temp }}/tracebolt-windows-setup/
          if-no-files-found: error
          retention-days: 7

  rust-gui-tls:
    name: PR201 single inert Rust GUI TLS case (no installer actions)
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 201 && github.repository == 'storminator89/Tracebolt' }}
    runs-on: windows-2025
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      GOTOOLCHAIN: local
      PYTHONDONTWRITEBYTECODE: '1'
      TRACEBOLT_RUST_GUI_CI: github-actions-pr201-tls-only-v1
      TRACEBOLT_RUST_GUI_CI_SOURCE: ${{ github.sha }}
      TRACEBOLT_RUST_GUI_CI_HEAD: ${{ github.event.pull_request.head.sha }}
      TRACEBOLT_RUST_GUI_CI_BASE: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Build exact inert test image twice and verify finite provenance
        shell: pwsh
        run: python -I -B tests/windows_setup_rust_gui/build_ci.py --build-inert-github-tls-fixture --source "$env:GITHUB_SHA"
      - name: Run exactly one TLS fake-hook GUI case; fail if desktop unavailable
        shell: pwsh
        run: python -I -B tests/windows_setup_rust_gui/run_ci.py --execute-github-tls-fixture --source "$env:GITHUB_SHA"
