ffed0083b607f064b9c6a5309464aa424190"},{"branch":"review/windows-parity-foundations-3ba4459","sha":"83aa24f4cc00c03603c539972e0ed8dad38e563f"},{"branch":"review/windows-parity-integrated-ac22f84","sha":"b8884c24fd64f202c40b2cfa46c485842ef992e7"},{"branch":"review/windows-prerelease-accepted-14719116","sha":"9fcf070bc91a9275c04bf51ba96d23d92483ed5d"},{"branch":"review/windows-prerelease-publisher","sha":"8ef5a3ee765b7026bf59eb74ee631927cf851927"},{"branch":"review/windows-prerelease-v2","sha":"7f3c671d870df06a8784e3656cf3078b2de3a57d"},{"branch":"review/windows-service-health-72bfa0d","sha":"5aefcc58ed6eceb31c22768bc37780e3d244a239"},{"branch":"review/windows-setup-installer","sha":"266669d37c7a751de369647b2c1872fc59f42549"},{"branch":"review/windows-updates-end-to-end-83aa24f","sha":"1b8c16402ec463c97630d1e08eca8129b8c79e63"},{"branch":"reviewed/read-admin-arm64-2df4f5b","sha":"2df4f5b4185e31ed36c8bb162fd88b8cd3334ae7"},{"branch":"reviewed/read-admin-upgrade-405f57f","sha":"405f57f184e75736477cbd3af7a2536ddfe0e6f6"},{"branch":"reviewed/read-admin-upgrade-51f0ddb","sha":"51f0ddb5a54255dfb77d2e079c6ca0671354c99c"},{"branch":"reviewed/read-admin-upgrade-bb76d6a","sha":"bb76d6a6b7000b244b8075d5644562ad0da94c91"},{"branch":"reviewed/windows-inventory-647f8ae","sha":"647f8ae8cba2c00b542d8e567cef48da39fd3d1c"},{"branch":"test/current-windows-native-profile-947e81d","sha":"608aeb458c90f2d5568aeb13c41381e068f39434"},{"branch":"test/deterministic-retention-pressure-20261010","sha":"e2b8facc1ed20901d9c317226748b38db2f51b75"},{"branch":"test/macos-built-in-docs-fac596d0","sha":"330cb0154a6732d5c34192b65f003989e122f18d"},{"branch":"test/macos-native-fixtures-7c1bc732","sha":"688138daa94f6306f09e6b5ce62794ff626dd28c"},{"branch":"test/v3-failure-diagnostics","sha":"5d220d3d934ceab5938b532eec113c632a32fca1"}]
        run: |
          python3 - <<'PYTHON'
          import base64, json, os, re, subprocess
          from pathlib import Path
          plan = json.loads(os.environ['BRANCH_CLEANUP_PLAN'])
          assert len(plan) == len({row['branch'] for row in plan})
          env = os.environ.copy()
          auth = base64.b64encode(('x-access-token:' + env['GH_TOKEN']).encode()).decode()
          env.update(GIT_CONFIG_COUNT='1', GIT_CONFIG_KEY_0='http.https://github.com/.extraheader',
                     GIT_CONFIG_VALUE_0='AUTHORIZATION: basic ' + auth, GIT_TRACE='0', GIT_TRACE_CURL='0')
          def git(*args):
              return subprocess.run(['git', *args], env=env, capture_output=True, text=True)
          assert git('fetch', '--no-tags', 'origin', '+refs/heads/main:refs/remotes/origin/main').returncode == 0
          main = git('rev-parse', 'refs/remotes/origin/main').stdout.strip()
          results = []
          for row in plan:
              branch, sha = row['branch'], row['sha']
              assert branch != 'main' and re.fullmatch('[0-9a-f]{40}', sha)
              assert git('check-ref-format', '--branch', branch).returncode == 0
              ref = 'refs/heads/' + branch
              current = git('ls-remote', '--refs', 'origin', ref)
              if current.returncode:
                  status = 'kept: remote lookup failed'
              elif not current.stdout.strip():
                  status = 'already absent'
              elif current.stdout.split()[0] != sha:
                  status = 'kept: branch tip changed'
              elif git('merge-base', '--is-ancestor', sha, main).returncode:
                  status = 'kept: not contained in main'
              else:
                  # Server-side lease also rejects a concurrent update after ls-remote.
                  deleted = git('push', '--porcelain', '--force-with-lease=' + ref + ':' + sha, 'origin', ':' + ref)
                  status = 'deleted' if deleted.returncode == 0 else 'kept: deletion refused'
              results.append(dict(branch=branch, sha=sha, status=status))
              print(branch + ': ' + status)
          Path('branch-cleanup-results.json').write_text(json.dumps(dict(main=main, branches=results), indent=2) + '\n')
          deleted = sum(row['status'] == 'deleted' for row in results)
          kept = sum(row['status'].startswith('kept:') for row in results)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(f'Checked {len(results)} branch tips against main `{main}`. Deleted {deleted}; preserved {kept}. Main and tags were not deleted.\n')
          if kept:
              raise SystemExit('Some branches were preserved; inspect the audit artifact before retrying.')
          PYTHON
      - name: Retain branch SHA restore map and deletion audit
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: merged-branch-cleanup-audit
          path: branch-cleanup-results.json
          if-no-files-found: error
