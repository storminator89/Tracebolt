name: Verify published Linux release bytes

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-published-release.yml'
      - 'deploy/release/verify-published-release.py'
      - 'deploy/release/linux-bootstrap.py'
      - 'deploy/release/publish-linux-release.py'
      - 'tests/release/test_verify_published_release.py'

permissions:
  contents: read

concurrency:
  group: tracebolt-public-readback-pilot2
  cancel-in-progress: false

jobs:
  verify-published-release:
    if: github.repository == 'storminator89/Tracebolt' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the bounded verifier using inert fixtures
        run: python3 -I -B -m unittest discover -s tests/release -v
      - name: Verify the published pilot without executing Tracebolt or installing a service
        env:
          TRACEBOLT_VERIFY_PUBLISHED_PILOT2: '1'
        run: >-
          python3 -I -B deploy/release/verify-published-release.py
          --verify-published-pilot2
          --output "$RUNNER_TEMP/tracebolt-public-readback"
      - name: Preserve only verified public metadata and the fixed verification result
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: verified-public-linux-pilot2
          path: |
            ${{ runner.temp }}/tracebolt-public-readback/bootstrap.py
            ${{ runner.temp }}/tracebolt-public-readback/manifest.json
            ${{ runner.temp }}/tracebolt-public-readback/manifest.sigstore.json
            ${{ runner.temp }}/tracebolt-public-readback/verification-result.json
          if-no-files-found: error
          retention-days: 7
