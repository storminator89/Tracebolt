name: Windows read-only foundation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: windows-readonly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-readonly:
    name: Windows amd64 native inventory and event metadata (no service install)
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Native bounded read-only checks with no telemetry output or artifacts
        env:
          GOTOOLCHAIN: local
          PYTHONDONTWRITEBYTECODE: '1'
        run: python tests/security/run_windows_readonly.py
