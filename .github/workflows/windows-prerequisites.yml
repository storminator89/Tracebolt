name: Read-only Windows prerequisite measurement

# Ordinary source CI only. This never dispatches or enables native acceptance.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  read-only-prerequisites:
    name: Windows static prerequisites (read-only; service access unverified)
    if: ${{ github.repository == 'storminator89/Tracebolt' }}
    runs-on: windows-2025
    timeout-minutes: 15
    env:
      TRACEBOLT_PREREQUISITE_SOURCE_SHA: ${{ github.sha }}
      PYTHONDONTWRITEBYTECODE: '1'
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Verify exact checked-out source before read-only measurement
        shell: pwsh
        run: python -I -B tests/windows_native_acceptance/run_prerequisites.py --check-source
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Pure read-only runner and report fixtures (not native proof)
        shell: pwsh
        run: python -I -B -m unittest discover -s tests/windows_native_acceptance -p "test_prerequisites.py"
      - name: In-memory Windows diagnostic fixtures (no native host changes)
        shell: pwsh
        run: python -I -B tests/windows_native_acceptance/run_prerequisites.py --check-fixtures
      - name: Build separate source-bound read-only prerequisite executable
        id: measurement
        shell: pwsh
        run: python -I -B tests/windows_native_acceptance/run_prerequisites.py --run-read-only
      - name: Retain only validated finite read-only measurement
        if: ${{ always() && !cancelled() && steps.measurement.outputs.report_validated == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: windows-prerequisites-${{ github.sha }}
          path: ${{ runner.temp }}/tracebolt-windows-prerequisites.json
          if-no-files-found: error
          retention-days: 3
