name: tracebolt
services:
  manager:
    image: tracebolt-manager:local
    build:
      context: ..
      dockerfile: Dockerfile
    command: ["--lan-config", "/run/tracebolt/lan.json"]
    user: "65532:65532"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 512m
    cpus: 2
    restart: unless-stopped
    stop_grace_period: 15s
    ports:
      # Loopback publication is the default. Changing this is a deployment step.
      - "${TRACEBOLT_BIND_IP:-127.0.0.1}:8443:8443"
      - "${TRACEBOLT_BIND_IP:-127.0.0.1}:8444:8444"
    volumes:
      - state:/data
      - type: bind
        source: ${TRACEBOLT_CONFIG_DIR:?Set TRACEBOLT_CONFIG_DIR to an absolute private TLS/config directory}
        target: /run/tracebolt
        read_only: true
        bind:
          create_host_path: false
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
volumes:
  state:
